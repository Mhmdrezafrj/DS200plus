name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site (unzip if a zip is uploaded)
        run: |
          mkdir _site
          ZIP=$(ls *.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then
            unzip -o -q "$ZIP" -d _site
            IDX=$(find _site -name index.html | head -1)
            DIR=$(dirname "$IDX")
            if [ "$DIR" != "_site" ]; then
              cp -r "$DIR"/. _site/
            fi
          else
            cp -r index.html _site/
          fi
          test -f _site/index.html
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
