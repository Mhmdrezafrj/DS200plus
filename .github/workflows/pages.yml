name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project
        run: |
          mkdir proj
          unzip -o -q "$(ls *.zip | head -1)" -d proj
          P=$(dirname "$(find proj -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "PROJ=$P" >> $GITHUB_ENV

      - name: Install and add Android
        run: |
          cd "$PROJ"
          npm install
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd "$PROJ/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ${{ env.PROJ }}/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest "$PROJ/android/app/build/outputs/apk/debug/app-debug.apk" --title "APK" --notes "Debug build"
